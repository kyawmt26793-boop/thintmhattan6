name: Build Offline Capacitor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Fix Folder Structure if Uploaded Flat from Mobile
        run: |
          mkdir -p src public assets
          [ -f "App.jsx" ] && mv App.jsx src/App.jsx || true
          [ -f "main.jsx" ] && mv main.jsx src/main.jsx || true
          [ -f "index.css" ] && mv index.css src/index.css || true
          [ -f "icon.svg" ] && cp icon.svg public/icon.svg || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build React Web App
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "သင့်မှတ်တမ်း" "com.mytracker.liquidglass" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare 1024x1024 PNG Icon & Generate Android APK Icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
          mkdir -p assets
          if [ -f "icon.png" ]; then
            convert icon.png -resize 1024x1024\! assets/icon.png
          elif [ -f "public/icon.png" ]; then
            convert public/icon.png -resize 1024x1024\! assets/icon.png
          elif [ -f "public/icon.svg" ]; then
            rsvg-convert -w 1024 -h 1024 public/icon.svg -o assets/icon.png
          fi
          cp assets/icon.png assets/icon-only.png
          cp assets/icon.png assets/icon-foreground.png
          convert -size 1024x1024 xc:"#07111e" assets/icon-background.png
          convert -size 2732x2732 xc:"#07111e" assets/splash.png
          npx @capacitor/assets generate --android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-Glass-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
